status = error
name = PropertiesConfig
packages = org.folio.okapi.common.logging

filters = threshold

filter.threshold.type = ThresholdFilter
# Raised from info to debug (temporarily, for MODINVSTOR-1608 CI diagnosis) so the
# org.folio.services.domainevent logger below can actually emit its debug output;
# root and every other logger stay at their existing effective level regardless.
filter.threshold.level = debug

appenders = console

appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss} [$${FolioLoggingContext:requestId}] [$${FolioLoggingContext:tenantId}] [$${FolioLoggingContext:userId}] [$${FolioLoggingContext:moduleId}] %-5p %-20.20C{1} %m%n

loggers = kafka, pgNotice, domainEvent, fakeKafkaConsumer

logger.kafka.name = org.apache.kafka
logger.kafka.level = warn
logger.kafka.additivity = false
logger.kafka.appenderRefs = stdout
logger.kafka.appenderRef.stdout.ref = STDOUT

# Temporary, for MODINVSTOR-1608 CI diagnosis: confirms whether publishUpdated actually
# sends the holdings UPDATE domain event for the shouldUpdateItems (item-effective-location)
# path. Remove once HoldingsItemPropagationIT's CI-only failure is root-caused.
logger.domainEvent.name = org.folio.services.domainevent
logger.domainEvent.level = debug
logger.domainEvent.additivity = false
logger.domainEvent.appenderRefs = stdout
logger.domainEvent.appenderRef.stdout.ref = STDOUT

logger.fakeKafkaConsumer.name = org.folio.support.kafka.FakeKafkaConsumer
logger.fakeKafkaConsumer.level = debug
logger.fakeKafkaConsumer.additivity = false
logger.fakeKafkaConsumer.appenderRefs = stdout
logger.fakeKafkaConsumer.appenderRef.stdout.ref = STDOUT

# Postgres backend NOTICE messages (e.g. "truncate cascades to table ...") are logged here
# at WARN by the Vert.x PG client; they are routine, not actionable, and flood test/tenant
# teardown output, so drop them below ERROR.
logger.pgNotice.name = io.vertx.sqlclient.codec.SocketConnectionBase
logger.pgNotice.level = error
logger.pgNotice.additivity = false
logger.pgNotice.appenderRefs = stdout
logger.pgNotice.appenderRef.stdout.ref = STDOUT

rootLogger.level = info
rootLogger.appenderRefs = info
rootLogger.appenderRef.stdout.ref = STDOUT
